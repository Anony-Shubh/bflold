<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="js/jquery.min.1.7.js"></script>
    <script type="text/javascript" src="js/turn.min.js"></script>
    <script type="text/javascript" src="js/modernizr.2.5.3.min.js"></script>
</head>
<body>
    <div id="container">
        <div id="flipbook">
            <div class="hard"><img src="img/1234.jpg" alt="" width="100%" height="100%"></div>
                <div class="hard"><img src="img/12345.jpg" alt=""></div>
                <%@ include file="connectionOpen.jsp"%>
                <%
                    query="select *  from table1";
                    ps=con.prepareStatement(query);
                    rs=ps.executeQuery();
                    while(rs.next()){ 
                        img=rs.getString("img");
                        name=rs.getString("name");
                %>
                    <div class="odd">
                        <img src="<%=img%>">
                    </div>
                    <div class="even">
                        <p>Name:<%=name%></p>
                    </div>
                <%
                }
                %>
                <%@ include file="connectionClose.jsp"%>
                    <div class="hard"><img src="img/123456.jpg" alt=""></div>
                    <div class="hard"><img src="img/12333.jpg" alt=""></div>
                    
        </div>
    </div>
    
<style>
    body{
        overflow: hidden;
        background: whitesmoke;
    }
    #container{
        margin: 0 auto;
        width: 100%;
        padding: 50px 150px 150px 150px;
    }
    #flipbook{
        overflow: hidden;
        width: 100%;
        height: 100%;
        text-align: center;
    }
    #flipbook .page{
        width: 461px;
        height: 600px;
        background-color: white;
        background-repeat: no-repeat;
        background-size: 100% 100%;

    }
    #flipbook iframe{
        margin: 0 auto;
        padding: 25px 5px 10px 15px;
    }
    #flipbook .page-wrapper{
        -webkit-perspective: 2000px;
        -moz-perspective: 2000px;
        -o-perspective:2000px;
        perspective: 2000px;
    }
    #flipbook .hard{
        background: darkgray;
        color: #ffffff;
        -webkit-box-shadow: inset 0 0 5px #666666;
        -moz-box-shadow: inset 0 0 5px #666666;
        -o-box-shadow: inset 0 0 5px #666666;
        box-shadow: inset 0 0 5px #666666;
        font-weight: bold;
    }
    #flipbook .even{
	background-image:-webkit-linear-gradient(left, #FFF 95%, #ddd 100%);
	background-image:-moz-linear-gradient(left, #FFF 95%, #ddd 100%);
	background-image:-o-linear-gradient(left, #FFF 95%, #ddd 100%);
	background-image:-ms-linear-gradient(left, #FFF 95%, #ddd 100%);

}
#flipbook .odd img{
	width: 95%;
	height: 97%;
	margin-top: 7px;
	margin-left: 7px;
}

#flipbook .odd{
	background-image:-webkit-linear-gradient(right, #FFF 95%, #ddd 100%);
	background-image:-moz-linear-gradient(right, #FFF 95%, #ddd 100%);
	background-image:-o-linear-gradient(right, #FFF 95%, #ddd 100%);
	background-image:-ms-linear-gradient(right, #FFF 95%, #ddd 100%);
	
}
</style>
<script>
    $("#flipbook").turn({
        width: 800,
        height: 500,
        autocenter: true,
        next:true
    });
    $(window).bind('keydown', function(e){

if (e.target && e.target.tagName.toLowerCase()!='input')
    if (e.keyCode==37)
        $('#flipbook').turn('previous');
    else if (e.keyCode==39)
        $('#flipbook').turn('next');
    });
</script>
</body>
</html>
