                                    <h5>SMS SERVICE</h5>
                                </div>
                                <div class="info-data">

                                        <input type="checkbox" id="ai" name="units2" value=""> <label class="dest-text"

                                            Artisons</label>

                                </div>
                                <div class="sms-area">
                                    <div class="row">
                                        <div class="col-lg-3 col-md-12"></div>
                                        <div class="col-lg-6 col-md-12">
                                            <textarea class="form-control" name="" id="" cols="30" rows="10"
                                                placeholder="Type the SMS text here...."></textarea>
                                        </div>
                                        <div class="col-lg-3 col-md-12"></div>
                                    </div>
                                </div>
                                <div class="sms-area">

                                        <div class="col-lg-3 col-md-12"></div>
                                        <div class="col-lg-6 col-md-12">

                            </div>

                    </div>

    <script>
        $(document).ready(function () {
            $('#login-alert').click(function () {
                $('.alert').show()
            })
        });

        function readonlyFunction() {
            document.getElementById("main").disabled = true;
            document.getElementById("main").style.filter = 'blur(10px)';
        }

    <script>
